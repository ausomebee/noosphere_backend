name: Deploy Backend to Dev Server

on:
  push:
    branches:
      - develop
      - pre-prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST_BACKEND }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          BRANCH=${GITHUB_REF##*/}
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} << EOF
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin $BRANCH
            npm install
            pm2 stop all || true
            pm2 start src/server.js --name noosphere_backend
            pm2 save
          EOF
