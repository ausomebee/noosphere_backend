name: Deploy Backend to Dev Server

on:
  push:
    branches:
      - develop
      - pre-prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Avoid failure if host is not reachable immediately
          ssh-keyscan -H ${{ secrets.EC2_HOST_BACKEND }} >> ~/.ssh/known_hosts || true

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} "echo Connected successfully"

      - name: Deploy to EC2
        run: |
          BRANCH=${GITHUB_REF##*/}

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} << EOF
            set -e

            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Deploying branch: $BRANCH"

            git fetch origin
            git reset --hard origin/$BRANCH

            npm install --production

            pm2 stop noosphere-backend || true
            pm2 start src/server.js --name noosphere-backend
            pm2 save
          EOF
