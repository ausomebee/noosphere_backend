name: Deploy Backend to Dev Server

on:
  push:
    branches:
      - develop
      - pre-prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST_BACKEND }} >> ~/.ssh/known_hosts || true

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} "echo ✅ Connected to EC2"

      - name: Deploy to EC2 (Production Grade)
        run: |
          BRANCH=${GITHUB_REF##*/}

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} "
            set -e

            echo '🚀 Starting deployment...'
            echo 'Branch: $BRANCH'

            # Ensure directory exists
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}

            # First-time setup (clone if missing)
            if [ ! -d '.git' ]; then
              echo '📦 Cloning repository...'
              git clone git@github.com:ausomebee/noosphere_backend.git .
            fi

            echo '🔄 Fetching latest code...'
            git fetch origin

            echo '⚡ Resetting to latest version...'
            git reset --hard origin/$BRANCH

            echo '📦 Installing dependencies...'
            npm ci --production

            echo '🧠 Checking PM2...'
            if ! command -v pm2 &> /dev/null; then
              echo 'Installing PM2...'
              npm install -g pm2
            fi

            echo '🔁 Restarting application (zero downtime)...'
            pm2 reload noosphere-backend || pm2 start src/server.js --name noosphere-backend

            pm2 save

            echo '✅ Deployment completed successfully'
          "
