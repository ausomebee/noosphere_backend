name: Deploy Backend to Dev Server

on:
  push:
    branches:
      - develop
      - pre-prod
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST_BACKEND }} >> ~/.ssh/known_hosts || true

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} \
            "echo ✅ Connected to EC2"

      - name: Deploy to EC2 (Production Grade)
        run: |
          BRANCH=${GITHUB_REF##*/}

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_BACKEND }} << EOF
            set -e

            echo '🚀 Starting deployment...'
            echo 'Branch: $BRANCH'

            # Ensure directory exists
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}

            # First-time setup (clone if missing)
            if [ ! -d '.git' ]; then
              echo '📦 Cloning repository...'
              git clone git@github.com:ausomebee/noosphere_backend.git .
            fi

            echo '🔄 Fetching latest code...'
            git fetch origin

            echo '⚡ Resetting to latest version...'
            git reset --hard origin/$BRANCH

            echo '📝 Creating .env file...'
            cat > .env << EOL
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLIENT_URL=${{ secrets.CLIENT_URL }}
          CLOUDWATCH_USERNAME=${{ secrets.CLOUDWATCH_USERNAME }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EC2_INSTANCE_ID=${{ secrets.EC2_INSTANCE_ID }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_EXPIRE=${{ secrets.JWT_EXPIRE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MAIL_PASS=${{ secrets.MAIL_PASS }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          MY_DB_INSTANCE=${{ secrets.MY_DB_INSTANCE }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=${{ secrets.PORT }}
          RDS_INSTANCE_ID=${{ secrets.RDS_INSTANCE_ID }}
          RDS_TOTAL_MEMORY_GB=${{ secrets.RDS_TOTAL_MEMORY_GB }}
          RDS_TOTAL_STORAGE_GB=${{ secrets.RDS_TOTAL_STORAGE_GB }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          SERVER_URL=${{ secrets.SERVER_URL }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          TRY=${{ secrets.TRY }}
          EOL

            echo '✅ .env file created successfully'

            echo '📦 Installing dependencies...'
            npm install --production

            echo '🧠 Checking PM2...'
            if ! command -v pm2 &> /dev/null; then
              echo 'Installing PM2...'
              npm install -g pm2
            fi

            echo '🔁 Restarting application (zero downtime)...'
            pm2 reload noosphere-backend || pm2 start src/server.js --name noosphere-backend

            pm2 save

            echo '✅ Deployment completed successfully'
          EOF
