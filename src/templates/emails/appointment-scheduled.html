<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Scheduled</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background:linear-gradient(90deg,#8B5CF6 0%,#EC4899 50%,#EF4444 100%);padding:24px;text-align:center;color:#ffffff;font-size:24px;font-weight:bold;">
                Appointment Scheduled
              </td>
            </tr>
            <tr>
              <td style="padding:32px 40px;">
                <p style="margin:0 0 12px 0;font-size:16px;line-height:1.6;">Hello {{recipientName}},</p>
                <p style="margin:0 0 12px 0;font-size:16px;line-height:1.6;">Your appointment with {{clientName}} has been scheduled for <strong>{{appointmentDate}}</strong> at <strong>{{appointmentTime}}</strong>.</p>
                <p style="margin:0 0 12px 0;font-size:16px;line-height:1.6;">Thank you for choosing {{companyName}}.</p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280;">If you need help, please contact us at <a href="mailto:{{subdomain}}.noospherehub.net" style="color:#2563eb;text-decoration:none;">{{subdomain}}.noospherehub.net</a>.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
