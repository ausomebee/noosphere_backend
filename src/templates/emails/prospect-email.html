<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>{{subject}}</title>
    <style>
        :root {
            color-scheme: light only;
            supported-color-schemes: light only;
        }

        html,
        body,
        .email-background,
        .email-container,
        .email-content {
            background-color: #ffffff !important;
            background-image: linear-gradient(#ffffff, #ffffff) !important;
        }

        @media (prefers-color-scheme: dark) {
            html,
            body,
            .email-background,
            .email-container,
            .email-content {
                background-color: #ffffff !important;
                background-image: linear-gradient(#ffffff, #ffffff) !important;
            }

            h1 {
                color: #004aba !important;
            }

            .email-body {
                color: #475467 !important;
            }

            .sign-off {
                color: #667085 !important;
            }

            .signature {
                color: #004aba !important;
            }
        }
    </style>
</head>
<body bgcolor="#ffffff" style="margin:0; padding:0; background-color:#ffffff !important; background-image:linear-gradient(#ffffff, #ffffff) !important; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#101828;">
    <table class="email-background" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="background-color:#ffffff !important; background-image:linear-gradient(#ffffff, #ffffff) !important;">
        <tr>
            <td align="center" bgcolor="#ffffff" style="padding:32px 16px; background-color:#ffffff !important;">
                <table class="email-container" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="max-width:600px; background-color:#ffffff !important; background-image:linear-gradient(#ffffff, #ffffff) !important; border:1px solid #eaecf0; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(16,24,40,0.08);">
                    <tr>
                        <td align="center" style="padding:32px; border-bottom:1px solid #eaecf0;">
                            <img src="cid:unique@image" alt="Noosphere" width="180" style="display:block; width:180px; max-width:100%; height:auto; border:0;">
                        </td>
                    </tr>
                    <tr>
                        <td class="email-content" bgcolor="#ffffff" style="padding:40px 36px; background-color:#ffffff !important; background-image:linear-gradient(#ffffff, #ffffff) !important;">
                            <h1 style="margin:0 0 24px; font-size:24px; line-height:32px; font-weight:600; color:#004aba;">{{subject}}</h1>
                            <div class="email-body" style="font-size:16px; line-height:26px; color:#475467 !important; overflow-wrap:anywhere;">{{body}}</div>
                            <div style="margin-top:32px; padding-top:24px; border-top:1px solid #eaecf0;">
                                <p class="sign-off" style="margin:0 0 4px; font-size:15px; line-height:23px; color:#667085 !important;">Best regards,</p>
                                <p class="signature" style="margin:0; font-size:16px; line-height:24px; font-weight:600; color:#004aba !important;">The Noosphere Team</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
