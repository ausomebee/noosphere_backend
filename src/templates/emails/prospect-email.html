<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f7fb; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#101828;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f7fb;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(16,24,40,0.08);">
                    <tr>
                        <td align="center" style="padding:32px; border-bottom:1px solid #eaecf0;">
                            <img src="cid:unique@image" alt="Noosphere" width="180" style="display:block; width:180px; max-width:100%; height:auto; border:0;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:40px 36px;">
                            <h1 style="margin:0 0 24px; font-size:24px; line-height:32px; font-weight:600; color:#004aba;">{{subject}}</h1>
                            <div style="font-size:16px; line-height:26px; color:#475467; overflow-wrap:anywhere;">{{body}}</div>
                            <div style="margin-top:32px; padding-top:24px; border-top:1px solid #eaecf0;">
                                <p style="margin:0 0 4px; font-size:15px; line-height:23px; color:#667085;">Best regards,</p>
                                <p style="margin:0; font-size:16px; line-height:24px; font-weight:600; color:#004aba;">The Noosphere Team</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
