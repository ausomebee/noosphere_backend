    <main>
        <img src="/mailHeader.png" alt="" style="width: 100%; height: 70px; object-fit: cover;">
        <div style="font-family: Arial, Helvetica, sans-serif; text-align: center; max-width: 820px; margin: auto; padding: 20px; padding-bottom: 50px;">
            <img src="/logo.png" alt="" style="width: 230px; margin-top: 70px;">
            <p style="font-size: 26px; font-weight: 700; margin-top: 70px;">Plan Deactivated</p>
            <p style="color: #475467; font-size: 18px; margin-top: 20px; margin-bottom: 30px;">

            <a href="{{controlPanelUrl}}/plans" style="background-color: black; text-align: center; border-radius: 9999px; padding-top: 20px; padding-bottom: 20px; color: white; text-decoration: none; font-weight: 600; font-size: 18px; width: 90%; display: block; margin: auto;">View Plan</a>
