<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Support Ticket Submitted</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333333; background-color: #f5f5f5; margin: 0; padding: 20px; }
        .email-container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .email-content { padding: 40px 30px; }
        .logo-container { margin-bottom: 30px; text-align: center; }
        .ticket-badge { display: inline-block; background-color: #EFF8FF; color: #004ABA; border: 1px solid #99C2FF; border-radius: 20px; padding: 6px 18px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: 600; color: #004ABA; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #E0E0E0; }
        .billing-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .billing-table tr { border-bottom: 1px solid #F2F4F7; }
        .billing-table tr:last-child { border-bottom: none; }
        .billing-table td { padding: 12px 0; font-size: 15px; }
        .billing-label { color: #475467; width: 50%; }
        .billing-value { color: #101828; font-weight: 500; text-align: right; }
        .divider { border: none; border-top: 1px solid #E0E0E0; margin: 25px 0; }
        .footer-text { color: #1976D2; font-size: 16px; margin-bottom: 5px; }
        .team-signature { color: #1976D2; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-content">
            <div class="logo-container">
                <img src="/logo.png" alt="NooSphere" style="width: 180px;">
            </div>
            <div style="text-align: center;">
                <span class="ticket-badge">New Support Ticket</span>
            </div>
            <p style="font-size: 16px; color: #475467; margin-bottom: 30px;">A new support request has been submitted on NooSphere. Click here to view details.</p>
            <p class="section-title">Ticket Details</p>
            <table class="billing-table">
                <tr><td class="billing-label">Ticket ID</td><td class="billing-value" style="color:#004ABA;font-weight:600;">#{{ticketId}}</td></tr>
                <tr><td class="billing-label">Tenant</td><td class="billing-value">{{tenantName}}</td></tr>
                <tr><td class="billing-label">Subject</td><td class="billing-value">{{subject}}</td></tr>
                <tr><td class="billing-label">Category</td><td class="billing-value">{{category}}</td></tr>
                <tr><td class="billing-label">Priority</td><td class="billing-value">{{priority}}</td></tr>
                <tr><td class="billing-label">Submitted On</td><td class="billing-value">{{submittedOn}}</td></tr>
            </table>
            <a href="http://noospherehub.net/control/issues" style="background-color: black; text-align: center; border-radius: 9999px; padding: 16px 0; color: white; text-decoration: none; font-weight: 600; font-size: 16px; width: 90%; display: block; margin: auto;">View Ticket</a>
            <hr class="divider">
            <p class="footer-text">Best regards,</p>
            <p class="team-signature">NooSphere System</p>
        </div>
    </div>
</body>
</html>
