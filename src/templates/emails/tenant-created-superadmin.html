<body style="margin: 0%; padding: 0%; box-sizing: border-box; background-color: white;">
    <main>
        <img src="/mailHeader.png" alt="" style="width: 100%; height: 70px; object-fit: cover;">
        <div style="font-family: Arial, Helvetica, sans-serif; text-align: center; max-width: 820px; margin: auto; padding: 20px; padding-bottom: 50px;">
            <img src="/logo.png" alt="" style="width: 230px; margin-top: 70px;">
            <p style="font-size: 26px; font-weight: 700; margin-top: 70px;">New Tenant Created</p>
            <p style="color: #475467; font-size: 18px; margin-top: 20px; margin-bottom: 10px;">
                A new tenant has been registered on NooSphere.
            </p>
            <table style="margin: 30px auto; text-align: left; border-collapse: collapse; width: 90%;">
                <tr>
                    <td style="padding: 12px 16px; font-weight: 600; color: #344054; background-color: #f9fafb; border: 1px solid #e4e7ec;">Company Name</td>
                    <td style="padding: 12px 16px; color: #475467; border: 1px solid #e4e7ec;">{{companyName}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px 16px; font-weight: 600; color: #344054; background-color: #f9fafb; border: 1px solid #e4e7ec;">Email</td>
                    <td style="padding: 12px 16px; color: #475467; border: 1px solid #e4e7ec;">{{email}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px 16px; font-weight: 600; color: #344054; background-color: #f9fafb; border: 1px solid #e4e7ec;">Phone</td>
                    <td style="padding: 12px 16px; color: #475467; border: 1px solid #e4e7ec;">{{phoneNumber}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px 16px; font-weight: 600; color: #344054; background-color: #f9fafb; border: 1px solid #e4e7ec;">Date</td>
                    <td style="padding: 12px 16px; color: #475467; border: 1px solid #e4e7ec;">{{createdAt}}</td>
                </tr>
            </table>
            <a href="http://noospherehub.net/control/tenants" style="background-color: black; text-align: center; border-radius: 9999px; padding-top: 20px; padding-bottom: 20px; color: white; text-decoration: none; font-weight: 600; font-size: 18px; width: 90%; display: block; margin: auto;">View Tenant</a>
        </div>
    </main>
</body>
